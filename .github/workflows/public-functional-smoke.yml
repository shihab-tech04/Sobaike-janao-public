name: Public Functional Smoke

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_URL: https://shobaikejanao.com/
      SUPABASE_URL: https://eztqgqgpluoqwmprgeas.supabase.co
      SUPABASE_KEY: sb_publishable_M8nmD6rGWp42V9kIxHJU3A_-bx57_aY

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run comprehensive non-destructive Public browser smoke
        run: node scripts/public-functional-smoke.mjs
