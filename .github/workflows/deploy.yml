name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        env:
          VITE_SUPABASE_URL: https://eztqgqgpluoqwmprgeas.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_M8nmD6rGWp42V9kIxHJU3A_-bx57_aY
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Verify bundle is wired only to replacement Supabase
        shell: bash
        run: |
          set -euo pipefail
          grep -R -l --include='*.js' 'eztqgqgpluoqwmprgeas.supabase.co' dist/ >/dev/null
          if grep -R -l --include='*.js' 'ahiaymyqfmyyrjkwgvhi.supabase.co' dist/; then
            echo 'ERROR: published bundle still includes original Supabase project'
            exit 1
          fi

      - name: Verify Vite output
        run: |
          test -f dist/index.html
          echo "Checking generated index"
          cat dist/index.html
          if grep -q "/src/main.tsx" dist/index.html
          then
            echo "ERROR: source index deployed"
            exit 1
          fi

      - name: Stamp reproducible release manifest into deployed artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path('dist')
          index = dist / 'index.html'
          if not index.is_file():
              raise SystemExit('Missing built dist/index.html')
          payload = {
              'commit_sha': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'index_sha256': hashlib.sha256(index.read_bytes()).hexdigest(),
          }
          (dist / 'release-manifest.json').write_text(
              json.dumps(payload, sort_keys=True) + '\n', encoding='utf-8')
          print('Stamped exact-source release manifest:', payload['commit_sha'])
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Wait for legacy Pages publisher to finish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..120}; do
            status=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              | python -c 'import json,sys; runs=[r for r in json.load(sys.stdin).get("workflow_runs",[]) if r.get("name")=="pages build and deployment"]; print(max(runs,key=lambda r:r["id"]).get("status","none") if runs else "none")')
            if [ "$status" = "completed" ]; then
              echo "Legacy Pages publisher completed; safe to deploy Vite artifact."
              exit 0
            fi
            sleep 5
          done
          echo "Legacy Pages publisher did not finish in time."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
