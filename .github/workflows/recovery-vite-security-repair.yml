name: Recovery Vite Security Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'recovery/2026-10-21-public-consolidation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/2026-10-21-public-consolidation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install unchanged baseline
        run: npm ci
      - name: Regenerate lockfile for patched Vite 6.x only
        run: npm install --save-exact vite@6.4.4 --package-lock-only --ignore-scripts
      - name: Enforce only dependency manifests changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/changes.txt
          if grep -vE '^(package.json|package-lock.json)$' /tmp/changes.txt; then
            echo "Unexpected application source change"; exit 1
          fi
          grep -q '^package-lock.json$' /tmp/changes.txt
          node -e "const p=require('./package.json'); if(p.dependencies.vite!=='6.4.4')process.exit(1)"
      - name: Validate patched exact dependency tree
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run lint
          npm run build
      - name: Commit validated dependency update to draft integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No manifest changes"; exit 0
          fi
          git commit -m "fix(security): pin patched Vite 6.4.4 and refresh lockfile"
          git push origin HEAD:recovery/2026-10-21-public-consolidation
