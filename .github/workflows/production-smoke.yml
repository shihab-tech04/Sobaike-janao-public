name: Production Smoke

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact deployed 40-character main commit SHA'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://shobaikejanao.com
      SUPABASE_URL: https://eztqgqgpluoqwmprgeas.supabase.co
      SUPABASE_KEY: sb_publishable_M8nmD6rGWp42V9kIxHJU3A_-bx57_aY

    steps:
      - name: Verify canonical HTTPS domain serves the exact released bundle
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: an exact 40-character release commit SHA is required"
            exit 1
          fi
          curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors \
            --output "$RUNNER_TEMP/canonical-index.html" "$SITE_URL/"
          curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors \
            --output "$RUNNER_TEMP/release-manifest.json" "$SITE_URL/release-manifest.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          html_bytes = (Path(os.environ['RUNNER_TEMP']) / 'canonical-index.html').read_bytes()
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-manifest.json').read_text())
          if manifest.get('commit_sha') != os.environ['EXPECTED_SHA']:
              raise SystemExit('ERROR: canonical deployment commit does not match expected release SHA')
          if manifest.get('repository') != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('ERROR: deployed artifact belongs to a different repository')
          if manifest.get('index_sha256') != hashlib.sha256(html_bytes).hexdigest():
              raise SystemExit('ERROR: canonical index differs from release artifact hash')
          html = html_bytes.decode('utf-8', errors='replace')
          if ('id="root"' not in html and "id='root'" not in html) or '/src/main.tsx' in html:
              raise SystemExit('ERROR: canonical site missing built React application')

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'script' and a.get('src'):
                      self.assets.append((a['src'], 'javascript'))
                  if tag == 'link' and a.get('rel') == 'stylesheet' and a.get('href'):
                      self.assets.append((a['href'], 'css'))

          parser = Assets()
          parser.feed(html)
          if not any(kind == 'javascript' for _, kind in parser.assets):
              raise SystemExit('ERROR: canonical HTML has no JS bundle')
          origin = os.environ['SITE_URL'].rstrip('/') + '/'
          host = urlparse(origin).hostname
          for path, kind in parser.assets:
              target = urljoin(origin, path)
              uri = urlparse(target)
              # The Public app intentionally loads its Noto fonts from Google Fonts.
              # Keep third-party loading limited to this exact HTTPS stylesheet host.
              if uri.scheme != 'https':
                  raise SystemExit(f'ERROR: non-HTTPS asset origin: {path}')
              approved_external_font_css = kind == 'css' and uri.hostname == 'fonts.googleapis.com'
              if uri.hostname != host and not approved_external_font_css:
                  raise SystemExit(f'ERROR: unexpected asset origin: {path}')
              with urlopen(Request(target, headers={'User-Agent': 'SobaikeReleaseSmoke/1.0'}), timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(f'ERROR: asset HTTP {response.status}: {path}')
                  content_type = response.headers.get('content-type', '').lower()
                  if kind == 'javascript' and 'javascript' not in content_type:
                      raise SystemExit(f'ERROR: JS request served wrong MIME: {path} ({content_type})')
                  if kind == 'css' and 'css' not in content_type:
                      raise SystemExit(f'ERROR: CSS request served wrong MIME: {path} ({content_type})')
          print('Verified canonical Public bundle:', manifest['commit_sha'], 'HTML SHA-256:', manifest['index_sha256'])
          PY

      - name: Verify public Supabase payload privacy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          curl --fail-with-body -sS \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_public_published_reports" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' > /tmp/published-reports.json

          curl --fail-with-body -sS \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_public_home_feed" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_visitor_lat":null,"p_visitor_lng":null,"p_filter":"all","p_district":null}' > /tmp/home-feed.json

          python - <<'PY'
          import json
          from pathlib import Path

          forbidden_exact = {
              'latitude', 'longitude', 'lat', 'lng', 'coordinates', 'coordinate',
              'distance', 'distance_m', 'distance_meters', 'visitor_lat', 'visitor_lng',
              'reporter_latitude', 'reporter_longitude', 'reporter_lat', 'reporter_lng',
              'gps', 'location_accuracy', 'location_accuracy_m', 'location_accuracy_meters',
              'reporter_contact', 'contact_info', 'contact_email_or_phone',
              'client_submission_id', 'visitor_id', 'session_id'
          }

          def scan(value, path='root'):
              leaks = []
              if isinstance(value, dict):
                  for key, child in value.items():
                      normalized = str(key).lower()
                      if normalized in forbidden_exact:
                          leaks.append(f'{path}.{key}')
                      leaks.extend(scan(child, f'{path}.{key}'))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      leaks.extend(scan(child, f'{path}[{index}]'))
              return leaks

          for filename in ('/tmp/published-reports.json', '/tmp/home-feed.json'):
              data = json.loads(Path(filename).read_text())
              leaks = scan(data)
              if leaks:
                  raise SystemExit(f'Public privacy regression in {filename}: {leaks[:20]}')

          print('Public Supabase payload privacy check passed')
          PY

      - name: Verify hardened anonymous RPC surface
        shell: bash
        run: |
          set -euo pipefail

          call_rpc() {
            local rpc="$1"
            local payload="$2"
            local outfile="$3"
            curl -sS -o "$outfile" -w "%{http_code}" \
              -X POST "$SUPABASE_URL/rest/v1/rpc/$rpc" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              -d "$payload"
          }

          legacy_code=$(call_rpc \
            submit_public_complaint \
            '{"p_payload":{},"p_client_submission_id":"security-test-legacy","p_reporter_context":{}}' \
            /tmp/legacy-submit.json)

          if ! grep -qi "permission denied" /tmp/legacy-submit.json; then
            echo "ERROR: legacy submit_public_complaint is still anonymously callable (HTTP $legacy_code)"
            cat /tmp/legacy-submit.json
            exit 1
          fi

          helper_code=$(call_rpc \
            can_upload_public_evidence \
            '{"p_storage_path":"public-submissions/security-test/file.webp"}' \
            /tmp/legacy-helper.json)

          if ! grep -qi "permission denied" /tmp/legacy-helper.json; then
            echo "ERROR: obsolete can_upload_public_evidence helper is still anonymously callable (HTTP $helper_code)"
            cat /tmp/legacy-helper.json
            exit 1
          fi

          duplicate_read_code=$(call_rpc \
            is_public_published_evidence \
            '{"p_storage_path":"public-submissions/security-test/file.webp"}' \
            /tmp/duplicate-read-helper.json)

          if ! grep -qi "permission denied" /tmp/duplicate-read-helper.json; then
            echo "ERROR: duplicate published-evidence helper is still anonymously callable (HTTP $duplicate_read_code)"
            cat /tmp/duplicate-read-helper.json
            exit 1
          fi

          echo "Anonymous RPC surface hardening check passed"
