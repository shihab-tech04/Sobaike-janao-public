<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <title>সবাইকে জানাও | Sobaike Janao</title>
    <script>
      // Preserve deep links when GitHub Pages serves this 404 document.
      (function () {
        var location = window.location;
        var isProjectHost = location.hostname.toLowerCase() === 'shihab-tech04.github.io';
        var segments = location.pathname.split('/').filter(Boolean);
        var projectPath = '';

        if (isProjectHost && segments[0] && segments[0].toLowerCase() === 'sobaike-janao-public') {
          projectPath = '/' + segments.shift();
        }

        // The Public app uses HashRouter. The canonical domain is hosted at /,
        // while the GitHub Pages project has a repository-name path prefix.
        var route = '/' + segments.join('/');
        window.location.replace(location.origin + projectPath + '/#' + route + (location.search || ''));
      })();
    </script>
  </head>
  <body></body>
</html>
